name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          token: ${{ secrets.BAKER_LAB_READ_TOKEN }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version, cache: pnpm }
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with: { toolchain: 1.97.1, targets: wasm32-unknown-unknown }
      - run: python scripts/verify_distribution.py --tag "${GITHUB_REF_NAME}"
      - run: bash scripts/build_patinae_viewer.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --dir packages/vscode package
      - name: Publish the extension to the VS Code Marketplace (if VSCE_PAT is set)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "${VSCE_PAT:-}" ]; then
            pnpm --dir packages/vscode exec vsce publish \
              -p "$VSCE_PAT" \
              --packagePath "$(ls packages/vscode/*.vsix | head -1)"
          else
            echo "VSCE_PAT secret not set; skipping Marketplace publish (GitHub release still includes the .vsix)."
          fi
      - run: uv build --all-packages
      - run: cargo build --workspace --release --locked
      - run: |
          mkdir -p release
          cp dist/* packages/vscode/*.vsix packages/web/vendor/*.tgz release/
          sha256sum release/* > release/SHA256SUMS
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          output-file: release/sbom.spdx.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: release/*

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          token: ${{ secrets.BAKER_LAB_READ_TOKEN }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version }
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with: { toolchain: 1.97.1, targets: wasm32-unknown-unknown }
      - run: cargo install wasm-pack --locked --version 0.13.1
      - run: bash scripts/build_patinae_viewer.sh
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/baker-laboratory/atomworks-studio:${{ github.ref_name }}
            ghcr.io/baker-laboratory/atomworks-studio:${{ github.sha }}
          sbom: true
          provenance: mode=max
