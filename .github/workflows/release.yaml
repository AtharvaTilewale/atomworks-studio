name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: .node-version, cache: pnpm }
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with: { toolchain: 1.97.1, targets: wasm32-unknown-unknown }
      - run: python scripts/verify_distribution.py --tag "${GITHUB_REF_NAME}"
      - run: bash scripts/build_patinae_viewer.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --dir packages/vscode package
      - run: uv build --all-packages
      - run: cargo build --workspace --release --locked
      - run: |
          mkdir -p release
          cp dist/* packages/vscode/*.vsix packages/web/vendor/*.tgz release/
          sha256sum release/* > release/SHA256SUMS
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          output-file: release/sbom.spdx.json
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: release/*
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: release/*

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: .node-version }
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with: { toolchain: 1.97.1, targets: wasm32-unknown-unknown }
      - run: cargo install wasm-pack --locked --version 0.13.1
      - run: bash scripts/build_patinae_viewer.sh
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/baker-laboratory/atomworks-studio:${{ github.ref_name }}
            ghcr.io/baker-laboratory/atomworks-studio:${{ github.sha }}
          sbom: true
          provenance: mode=max
          secrets: |
            github_token=${{ secrets.BAKER_LAB_READ_TOKEN }}
