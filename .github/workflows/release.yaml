name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - run: python scripts/verify_distribution.py --tag "${GITHUB_REF_NAME}"
      - run: bash scripts/build_patinae_viewer.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --dir packages/vscode package
      - run: uv build --all-packages
      - run: cargo build --workspace --release --locked
      - run: |
          mkdir -p release
          cp dist/* packages/vscode/*.vsix packages/web/vendor/*.tgz release/
          sha256sum release/* > release/SHA256SUMS
      - uses: anchore/sbom-action@v0
        with:
          path: .
          output-file: release/sbom.spdx.json
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - run: cargo install wasm-pack --locked --version 0.13.1
      - run: bash scripts/build_patinae_viewer.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/baker-laboratory/atomworks-studio:${{ github.ref_name }}
            ghcr.io/baker-laboratory/atomworks-studio:${{ github.sha }}
          sbom: true
          provenance: mode=max
          secrets: |
            github_token=${{ github.token }}
