name: VS Code extension

# Build the VS Code / Cursor extension on every push to main and publish it to a
# rolling "vscode-latest" prerelease so there is always a stable download link:
#   https://github.com/baker-laboratory/atomworks-studio/releases/download/vscode-latest/atomworks-annotation-studio.vsix
# Versioned releases (on v* tags) are produced by release.yaml, which can also
# publish to the VS Code Marketplace when a VSCE_PAT secret is configured.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vscode-extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Uses packages/vscode "package" script (tsc + vsce package --no-rewrite-relative-links).
      - run: pnpm --dir packages/vscode package
      - name: Stable-named copy for a permanent download link
        run: cp packages/vscode/*.vsix atomworks-annotation-studio.vsix
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vscode-extension
          path: packages/vscode/*.vsix
      - name: Update the rolling "vscode-latest" prerelease
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: vscode-latest
          name: AtomWorks Studio — VS Code extension (latest main)
          prerelease: true
          body: |
            Latest AtomWorks Studio VS Code / Cursor extension, rebuilt from `main`.

            **Install**
            1. Download `atomworks-annotation-studio.vsix` below.
            2. `code --install-extension atomworks-annotation-studio.vsix --force`
               (or Extensions panel → `···` → *Install from VSIX…*), then reload.

            **Point it at a Studio server** (the extension is a thin client):
            - Command Palette → *AtomWorks: Configure Annotation Studio Server* → enter the URL
              of a running Studio service (a hosted deployment, or a local `make run` at
              `http://127.0.0.1:8000`).
            - Command Palette → *AtomWorks: Open Annotation Studio*.

            Full setup and troubleshooting: `packages/vscode/README.md`.
          files: |
            atomworks-annotation-studio.vsix
            packages/vscode/*.vsix
