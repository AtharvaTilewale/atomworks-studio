name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  CARGO_TERM_COLOR: always

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with: { enable-cache: true }
      - run: python scripts/verify_distribution.py
      - run: uv run --no-project --python 3.12 python scripts/pin_deps.py
      - run: test -f LICENSE.md && test -f docs/PROVENANCE.md && test -f vendor/patinae/UPSTREAM.toml
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2 detect --source=/repo --no-git

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with: { enable-cache: true }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version, cache: pnpm }
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with: { toolchain: 1.97.1, components: "rustfmt,clippy" }
      - run: cargo install wasm-pack --locked --version 0.13.1
      - run: uv sync --all-packages --all-extras --all-groups
      - run: bash scripts/build_patinae_viewer.sh
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/generate_api_types.sh
      - run: git diff --exit-code -- packages/web/src/generated/api.d.ts
      - run: uv run ruff check packages providers scripts tests
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: pnpm typecheck
      - run: bash -n run.sh scripts/*.sh

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with: { enable-cache: true }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version, cache: pnpm }
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with: { toolchain: 1.97.1 }
      - run: cargo install wasm-pack --locked --version 0.13.1
      - run: uv sync --all-packages --all-extras --all-groups
      - run: bash scripts/build_patinae_viewer.sh
      - run: pnpm install --frozen-lockfile
      - run: cargo test --workspace --locked
      - run: uv run python scripts/run_pytest.py -q tests packages/pymol-plugin/smoke packages/pymol-plugin/tests
      - run: pnpm --dir packages/web test:unit
      - run: pnpm --dir packages/vscode test

  package:
    runs-on: ubuntu-latest
    needs: [policy, static, unit, docs]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version, cache: pnpm }
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with: { toolchain: 1.97.1, targets: wasm32-unknown-unknown }
      - run: cargo install wasm-pack --locked --version 0.13.1
      - run: bash scripts/build_patinae_viewer.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: python scripts/check_web_budget.py
      - run: pnpm --dir packages/vscode package
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: documentation
          path: docs/_build/html
      - run: uv build --all-packages
      - run: uv run scripts/check_distribution_assets.py dist
      - run: uv run --no-project --with twine python -m twine check --strict dist/*
      - name: Install and exercise the release wheel outside the checkout
        run: |
          uv venv "$RUNNER_TEMP/studio" --python 3.12
          uv pip install --python "$RUNNER_TEMP/studio/bin/python" torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python "$RUNNER_TEMP/studio/bin/python" --find-links dist dist/atomworks_studio-*.whl dist/atomworks_studio_editing-*.whl
          uv pip check --python "$RUNNER_TEMP/studio/bin/python"
          cp scripts/check_installed_studio.py "$RUNNER_TEMP/check_installed_studio.py"
          cp tests/fixtures/SAM_hbonds.cif "$RUNNER_TEMP/input.cif"
          cd "$RUNNER_TEMP"
          studio/bin/python check_installed_studio.py input.cif
      - name: Build and exercise the Docker Space recipe
        run: |
          mkdir -p examples/space/wheels
          cp dist/atomworks_studio-*.whl dist/atomworks_studio_editing-*.whl dist/atomworks_annotation_studio_rfd4-*.whl examples/space/wheels/
          docker build -t studio-space examples/space
          docker run -d --name studio-space -p 7860:7860 studio-space
          trap 'docker logs studio-space; docker rm -f studio-space' EXIT
          for attempt in {1..120}; do
            if curl --fail --silent http://127.0.0.1:7860/api/ready; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:7860/guide/TUTORIAL.html -o /dev/null
          curl --fail -F file=@tests/fixtures/SAM_hbonds.cif http://127.0.0.1:7860/api/v1/sessions -o /tmp/space-session.json
          python -c 'import json; assert json.load(open("/tmp/space-session.json"))["session_id"]'
          test "$(docker exec studio-space id -u)" = 1000
      - run: cargo build --workspace --release --locked
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          if-no-files-found: error
          path: |
            dist/*
            packages/vscode/*.vsix
            packages/web/dist/**
            target/release/libpatinae_annotation_studio.so

  integration:
    runs-on: ubuntu-latest
    needs: [policy, static, unit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with: { enable-cache: true }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version, cache: pnpm }
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with: { toolchain: 1.97.1, targets: wasm32-unknown-unknown }
      - run: cargo install wasm-pack --locked --version 0.13.1
      - run: uv sync --all-packages --all-extras --all-groups
      - run: bash scripts/accept_local.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: local-acceptance
          path: artifacts/local/

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: make docs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation
          if-no-files-found: error
          path: docs/_build/html/

  native-launcher:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with: { toolchain: 1.97.1 }
      - run: cargo test -p patinae-annotation-studio --locked
