name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  CARGO_TERM_COLOR: always

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with: { enable-cache: true }
      - run: python scripts/verify_distribution.py
      - run: uv run --no-project --python 3.12 python scripts/pin_deps.py
      - run: test -f LICENSE.md && test -f docs/PROVENANCE.md && test -f vendor/patinae/UPSTREAM.toml
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2 detect --source=/repo --no-git

  static:
    runs-on: ubuntu-latest
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.BAKER_LAB_READ_TOKEN }}@github.com/.insteadOf
      GIT_CONFIG_VALUE_0: https://github.com/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with: { enable-cache: true }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version, cache: pnpm }
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with: { toolchain: 1.97.1, components: rustfmt,clippy }
      - run: cargo install wasm-pack --locked --version 0.13.1
      - run: uv sync --all-packages --all-extras --all-groups
      - run: bash scripts/build_patinae_viewer.sh
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/generate_api_types.sh
      - run: git diff --exit-code -- packages/web/src/generated/api.d.ts
      - run: uv run ruff check packages providers tests
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: pnpm typecheck
      - run: bash -n run.sh deploy/brev/*.sh deploy/local/*.sh scripts/*.sh

  unit:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/.deps/rfd4/src
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.BAKER_LAB_READ_TOKEN }}@github.com/.insteadOf
      GIT_CONFIG_VALUE_0: https://github.com/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: baker-laboratory/RFD4-Proteina-dev
          ref: 0e9050ca426a74069b99b63ca4a6520b05c2f8c7
          path: .deps/rfd4
          sparse-checkout: src/rfproteina
          token: ${{ secrets.BAKER_LAB_READ_TOKEN }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with: { enable-cache: true }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version, cache: pnpm }
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with: { toolchain: 1.97.1 }
      - run: cargo install wasm-pack --locked --version 0.13.1
      - run: uv sync --all-packages --all-extras --all-groups
      - run: bash scripts/build_patinae_viewer.sh
      - run: pnpm install --frozen-lockfile
      - run: cargo test --workspace --locked
      - run: uv run python scripts/run_pytest.py -q tests packages/pymol-plugin/tests
      - run: pnpm --dir packages/web test:unit

  package:
    runs-on: ubuntu-latest
    needs: [policy, static, unit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version, cache: pnpm }
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with: { toolchain: 1.97.1, targets: wasm32-unknown-unknown }
      - run: cargo install wasm-pack --locked --version 0.13.1
      - run: bash scripts/build_patinae_viewer.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: python scripts/check_web_budget.py
      - run: pnpm --dir packages/vscode package
      - run: uv build --all-packages
      - run: cargo build --workspace --release --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages
          path: |
            dist/*
            packages/vscode/*.vsix
            packages/web/dist/**
            target/release/*

  integration:
    runs-on: ubuntu-latest
    needs: [policy, static, unit]
    env:
      PYTHONPATH: ${{ github.workspace }}/.deps/rfd4/src
      ANNOTATION_STUDIO_SKIP_CONTAINER: "1"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.BAKER_LAB_READ_TOKEN }}@github.com/.insteadOf
      GIT_CONFIG_VALUE_0: https://github.com/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: baker-laboratory/RFD4-Proteina-dev
          ref: 0e9050ca426a74069b99b63ca4a6520b05c2f8c7
          path: .deps/rfd4
          sparse-checkout: src/rfproteina
          token: ${{ secrets.BAKER_LAB_READ_TOKEN }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with: { enable-cache: true }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version, cache: pnpm }
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with: { toolchain: 1.97.1, targets: wasm32-unknown-unknown }
      - run: cargo install wasm-pack --locked --version 0.13.1
      - run: uv sync --all-packages --all-extras --all-groups
      - run: bash scripts/accept_local.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: local-acceptance
          path: artifacts/local/

  native-launcher:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with: { toolchain: 1.97.1 }
      - run: cargo test -p patinae-annotation-studio --locked

  image:
    runs-on: ubuntu-latest
    needs: [policy, static, unit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version }
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with: { toolchain: 1.97.1, targets: wasm32-unknown-unknown }
      - run: cargo install wasm-pack --locked --version 0.13.1
      - run: bash scripts/build_patinae_viewer.sh
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          push: false
          tags: atomworks-studio:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            github_token=${{ secrets.BAKER_LAB_READ_TOKEN }}
      - run: bash scripts/accept_container.sh atomworks-studio:test
