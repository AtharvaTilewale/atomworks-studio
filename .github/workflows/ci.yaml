name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  CARGO_TERM_COLOR: always

jobs:
  policy:
    runs-on: ubuntu-latest
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.BAKER_LAB_READ_TOKEN }}@github.com/.insteadOf
      GIT_CONFIG_VALUE_0: https://github.com/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          token: ${{ secrets.BAKER_LAB_READ_TOKEN }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with: { enable-cache: true }
      - run: python scripts/verify_distribution.py
      - run: uv run --no-project --python 3.12 python scripts/pin_deps.py
      - run: test -f LICENSE.md && test -f docs/PROVENANCE.md && test -f vendor/patinae/UPSTREAM.toml
      - run: git submodule deinit --force --all
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2 detect --source=/repo --no-git

  static:
    runs-on: ubuntu-latest
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.BAKER_LAB_READ_TOKEN }}@github.com/.insteadOf
      GIT_CONFIG_VALUE_0: https://github.com/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          token: ${{ secrets.BAKER_LAB_READ_TOKEN }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with: { enable-cache: true }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version, cache: pnpm }
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with: { toolchain: 1.97.1, components: "rustfmt,clippy" }
      - run: cargo install wasm-pack --locked --version 0.13.1
      - run: uv sync --all-packages --all-extras --all-groups
      - run: bash scripts/build_patinae_viewer.sh
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/generate_api_types.sh
      - run: git diff --exit-code -- packages/web/src/generated/api.d.ts
      - run: uv run ruff check packages providers scripts tests
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: pnpm typecheck
      - run: bash -n run.sh deploy/brev/*.sh deploy/local/*.sh deploy/lib/*.sh scripts/*.sh

  unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: studio_test
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U studio -d studio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ANNOTATION_STUDIO_TEST_DATABASE_URL: postgresql://studio:studio-test-only@127.0.0.1:5432/studio_test
      PYTHONPATH: ${{ github.workspace }}/external/RFD4-Proteina-dev/src
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.BAKER_LAB_READ_TOKEN }}@github.com/.insteadOf
      GIT_CONFIG_VALUE_0: https://github.com/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          token: ${{ secrets.BAKER_LAB_READ_TOKEN }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with: { enable-cache: true }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version, cache: pnpm }
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with: { toolchain: 1.97.1 }
      - run: cargo install wasm-pack --locked --version 0.13.1
      - run: uv sync --all-packages --all-extras --all-groups
      - run: bash scripts/build_patinae_viewer.sh
      - run: pnpm install --frozen-lockfile
      - run: cargo test --workspace --locked
      - run: uv run python scripts/run_pytest.py -q tests packages/pymol-plugin/smoke packages/pymol-plugin/tests
      - run: pnpm --dir packages/web test:unit

  package:
    runs-on: ubuntu-latest
    needs: [policy, static, unit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          token: ${{ secrets.BAKER_LAB_READ_TOKEN }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version, cache: pnpm }
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with: { toolchain: 1.97.1, targets: wasm32-unknown-unknown }
      - run: cargo install wasm-pack --locked --version 0.13.1
      - run: bash scripts/build_patinae_viewer.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: python scripts/check_web_budget.py
      - run: pnpm --dir packages/vscode package
      - run: uv build --all-packages
      - run: cargo build --workspace --release --locked
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: |
            dist/*
            packages/vscode/*.vsix
            packages/web/dist/**
            target/release/*

  integration:
    runs-on: ubuntu-latest
    needs: [policy, static, unit]
    env:
      PYTHONPATH: ${{ github.workspace }}/external/RFD4-Proteina-dev/src
      ANNOTATION_STUDIO_SKIP_CONTAINER: "1"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.BAKER_LAB_READ_TOKEN }}@github.com/.insteadOf
      GIT_CONFIG_VALUE_0: https://github.com/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          token: ${{ secrets.BAKER_LAB_READ_TOKEN }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with: { enable-cache: true }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version, cache: pnpm }
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with: { toolchain: 1.97.1, targets: wasm32-unknown-unknown }
      - run: cargo install wasm-pack --locked --version 0.13.1
      - run: uv sync --all-packages --all-extras --all-groups
      - run: bash scripts/accept_local.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: local-acceptance
          path: artifacts/local/

  native-launcher:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with: { toolchain: 1.97.1 }
      - run: cargo test -p patinae-annotation-studio --locked

  image:
    runs-on: ubuntu-latest
    needs: [policy, static, unit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          token: ${{ secrets.BAKER_LAB_READ_TOKEN }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version }
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with: { toolchain: 1.97.1, targets: wasm32-unknown-unknown }
      - run: cargo install wasm-pack --locked --version 0.13.1
      - run: bash scripts/build_patinae_viewer.sh
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          push: false
          tags: atomworks-studio:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: bash scripts/accept_container.sh atomworks-studio:test
