[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "atomworks-annotation-studio"
version = "0.1.0"
description = "Provider-based annotated-CIF editor API for AtomWorks"
readme = "README.md"
requires-python = ">=3.12,<=3.12.10"
license = "BSD-3-Clause"
dependencies = [
    "atomworks[ml]>=2.1.1,<3",
    "atomworks-studio-editing>=0.1.0,<0.2",
    "fastapi>=0.115,<2",
    "numpy>=1.26,<3",
    "pydantic>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "pyyaml>=6,<7",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
durable = [
    "boto3>=1.40,<2",
    "psycopg[binary,pool]>=3.2,<4",
]
quantum = [
    "atomworks-annotation-studio-quantum>=0.1.0,<0.2",
]
rfd4 = [
    "atomworks-annotation-studio-rfd4>=0.1.0,<0.2",
]
test = [
    "httpx2>=2.8,<3",
    "pytest>=8.2,<9",
]

[project.scripts]
atomworks-studio-durable = "annotation_studio.durable_cli:main"

[tool.uv.sources]
atomworks-annotation-studio-quantum = { workspace = true }
atomworks-annotation-studio-rfd4 = { workspace = true }
atomworks-studio-editing = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["annotation_studio"]

[tool.hatch.build.targets.sdist]
include = [
    "annotation_studio",
    "hatch_build.py",
    "pyproject.toml",
    "README.md",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.metadata]
allow-direct-references = true
