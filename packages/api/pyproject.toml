[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "atomworks-annotation-studio"
version = "0.1.0"
description = "Provider-based annotated-CIF editor API for AtomWorks"
readme = "README.md"
requires-python = ">=3.12,<=3.12.10"
license = { text = "NVIDIA Source Code License" }
dependencies = [
    "atomworks[ml] @ git+https://github.com/baker-laboratory/atomworks-dev.git@8e4b2c39dc87a5097fbac1553154a99a46cf9bb7",
    "fastapi>=0.115,<2",
    "numpy>=1.26,<3",
    "pydantic>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "pyyaml>=6,<7",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
rfd4 = [
    "atomworks-annotation-studio-rfd4>=0.1.0,<0.2",
]
test = [
    "httpx2>=2.8,<3",
    "pytest>=8.2,<9",
]

[tool.uv.sources]
atomworks-annotation-studio-rfd4 = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["annotation_studio"]

[tool.hatch.build.targets.sdist]
include = [
    "annotation_studio",
    "hatch_build.py",
    "pyproject.toml",
    "README.md",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.metadata]
allow-direct-references = true
