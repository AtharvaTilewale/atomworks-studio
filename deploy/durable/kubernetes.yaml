apiVersion: batch/v1
kind: Job
metadata:
  name: annotation-studio-migrate
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      imagePullSecrets: [{name: annotation-studio-ghcr}]
      containers:
        - name: migrate
          image: ${ANNOTATION_STUDIO_IMAGE}
          command: ["atomworks-studio-durable", "migrate"]
          env:
            - name: ANNOTATION_STUDIO_DATABASE_URL
              valueFrom: {secretKeyRef: {name: annotation-studio-runtime, key: database-url}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: annotation-studio-cleanup
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          imagePullSecrets: [{name: annotation-studio-ghcr}]
          containers:
            - name: cleanup
              image: ${ANNOTATION_STUDIO_IMAGE}
              command: ["atomworks-studio-durable", "cleanup"]
              env:
                - name: ANNOTATION_STUDIO_DATABASE_URL
                  valueFrom: {secretKeyRef: {name: annotation-studio-runtime, key: database-url}}
                - name: ANNOTATION_STUDIO_OBJECT_STORE_URL
                  value: ${ANNOTATION_STUDIO_OBJECT_STORE_URL}
                - name: AWS_ACCESS_KEY_ID
                  valueFrom: {secretKeyRef: {name: annotation-studio-runtime, key: object-access-key}}
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom: {secretKeyRef: {name: annotation-studio-runtime, key: object-secret-key}}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
                readOnlyRootFilesystem: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: annotation-studio
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: annotation-studio}
  template:
    metadata:
      labels: {app.kubernetes.io/name: annotation-studio}
    spec:
      imagePullSecrets: [{name: annotation-studio-ghcr}]
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: studio
          image: ${ANNOTATION_STUDIO_IMAGE}
          ports: [{name: http, containerPort: 8000}]
          env:
            - name: ANNOTATION_STUDIO_DATABASE_URL
              valueFrom: {secretKeyRef: {name: annotation-studio-runtime, key: database-url}}
            - name: ANNOTATION_STUDIO_OBJECT_STORE_URL
              value: ${ANNOTATION_STUDIO_OBJECT_STORE_URL}
            - name: ANNOTATION_STUDIO_IDENTITY_HEADER
              value: ${ANNOTATION_STUDIO_IDENTITY_HEADER}
            - name: ANNOTATION_STUDIO_TRUST_PROXY_IDENTITY
              value: "1"
            - name: ANNOTATION_STUDIO_REQUIRED_WORKER_REVISION
              value: ${ANNOTATION_STUDIO_REVISION}
            - name: ANNOTATION_STUDIO_AVAILABLE_CAPABILITIES
              value: rfd4,af3
            - name: ANNOTATION_STUDIO_METRICS_TOKEN
              valueFrom: {secretKeyRef: {name: annotation-studio-runtime, key: metrics-token}}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: annotation-studio-runtime, key: object-access-key}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: annotation-studio-runtime, key: object-secret-key}}
            - name: HOME
              value: /tmp
          startupProbe:
            httpGet: {path: /api/ready, port: http}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: {path: /api/ready, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 30
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "2", memory: 4Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts: [{name: temporary, mountPath: /tmp}]
      volumes: [{name: temporary, emptyDir: {sizeLimit: 512Mi}}]
---
apiVersion: v1
kind: Service
metadata:
  name: annotation-studio
spec:
  selector: {app.kubernetes.io/name: annotation-studio}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: annotation-studio
  annotations:
    cert-manager.io/cluster-issuer: ${ANNOTATION_STUDIO_CERT_ISSUER}
    nginx.ingress.kubernetes.io/auth-url: https://${ANNOTATION_STUDIO_HOST}/oauth2/auth
    nginx.ingress.kubernetes.io/auth-signin: https://${ANNOTATION_STUDIO_HOST}/oauth2/start?rd=$escaped_request_uri
    nginx.ingress.kubernetes.io/auth-response-headers: ${ANNOTATION_STUDIO_IDENTITY_HEADER}
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: ${ANNOTATION_STUDIO_INGRESS_CLASS}
  tls:
    - hosts: [${ANNOTATION_STUDIO_HOST}]
      secretName: ${ANNOTATION_STUDIO_TLS_SECRET}
  rules:
    - host: ${ANNOTATION_STUDIO_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: annotation-studio
                port: {name: http}
