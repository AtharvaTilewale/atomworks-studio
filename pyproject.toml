[tool.uv.workspace]
members = [
    "packages/api",
    "packages/editing",
    "packages/pymol-plugin",
    "providers/rfd4",
]

# atomworks and RFD4 are vendored as git submodules under external/ so a fresh
# `git clone --recursive` pins the exact library (dev) and model (main) commits.
[tool.uv.sources]
atomworks = { path = "external/atomworks-dev", editable = true }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "RUF", "UP"]

[tool.ruff.lint.per-file-ignores]
# FastAPI uses calls in defaults to declare request parsing.
"packages/api/annotation_studio/main.py" = ["B008"]
# PyMOL/Qt plugin boundaries must contain arbitrary host and third-party plugin failures.
"packages/pymol-plugin/*.py" = ["BLE001", "N807", "N999"]
"packages/pymol-plugin/**/*.py" = ["BLE001", "N999"]
# PyMOL must be initialized before importing modules that bind to its command API.
"packages/pymol-plugin/tests/conftest.py" = ["E402"]
# Optional RFD4 PyMOL editors follow Qt/PyMOL naming and broad-except conventions.
"providers/rfd4/atomworks_studio_rfd4/pymol/**/*.py" = ["BLE001", "N802", "N807", "N999"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/pymol-plugin/smoke", "packages/pymol-plugin/tests"]

[dependency-groups]
dev = [
    "ruff>=0.16.4",
]
