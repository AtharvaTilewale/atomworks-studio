[tool.uv.workspace]
members = [
    "packages/api",
    "packages/pymol-plugin",
    "providers/rfd4",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "RUF", "UP"]

[tool.ruff.lint.per-file-ignores]
# FastAPI uses calls in defaults to declare request parsing.
"packages/api/annotation_studio/main.py" = ["B008"]
# PyMOL/Qt plugin boundaries must contain arbitrary host and third-party plugin failures.
"packages/pymol-plugin/*.py" = ["BLE001", "N807", "N999"]
"packages/pymol-plugin/**/*.py" = ["BLE001", "N999"]
# PyMOL must be initialized before importing modules that bind to its command API.
"packages/pymol-plugin/tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/pymol-plugin/tests"]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]
